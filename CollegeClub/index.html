<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Club Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎓 College Club Management</h1>
    <p>Explore • Join • Participate</p>
</header>

<div class="container">

    <div class="form-card">
        <h2>Add New Club</h2>
        <input id="clubName" placeholder="Club Name">
        <input id="clubHead" placeholder="Club Head">
        <input id="clubCategory" placeholder="Category (Tech, Cultural)">
        <button onclick="addClub()">Add Club</button>
    </div>

    <div class="club-list" id="clubList"></div>

</div>

<script src="script.js"></script>
</body>
</html>
