<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Learning Resource Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📚 Learning Resource Hub</h1>
    <p>Learn • Practice • Grow</p>
</header>

<div class="container">

    <!-- Add Resource -->
    <div class="form-card">
        <h2>Add Learning Resource</h2>
        <input id="title" placeholder="Resource Title">
        <input id="category" placeholder="Category (Web, AI, Java)">
        <input id="link" placeholder="Resource Link">
        <button onclick="addResource()">Add Resource</button>
    </div>

    <!-- Resource List -->
    <div class="resource-list" id="resourceList"></div>

</div>

<script src="script.js"></script>
</body>
</html>
