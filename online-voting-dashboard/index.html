<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Voting Poll Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🗳️ Voting Poll Dashboard</h1>
    <p>Cast your vote & view live results</p>
</header>

<main class="container">

    <section class="poll">
        <h2>Which technology do you prefer?</h2>

        <button onclick="vote(0)">React</button>
        <button onclick="vote(1)">Angular</button>
        <button onclick="vote(2)">Vue</button>
        <button onclick="vote(3)">ASP.NET</button>
    </section>

    <section class="results">
        <h2>Live Results</h2>

        <div class="result">
            <span>React</span>
            <div class="bar"><div id="bar0"></div></div>
            <span id="count0">0</span>
        </div>

        <div class="result">
            <span>Angular</span>
            <div class="bar"><div id="bar1"></div></div>
            <span id="count1">0</span>
        </div>

        <div class="result">
            <span>Vue</span>
            <div class="bar"><div id="bar2"></div></div>
            <span id="count2">0</span>
        </div>

        <div class="result">
            <span>ASP.NET</span>
            <div class="bar"><div id="bar3"></div></div>
            <span id="count3">0</span>
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
