<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📊 Student Result Management</h1>

    <div class="form">
        <input id="roll" placeholder="Roll Number">
        <input id="name" placeholder="Student Name">
        <input id="marks" type="number" placeholder="Marks (out of 100)">
        <button onclick="addResult()">Add Result</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="resultTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
